<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eaisyDocs — Teszt Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0d; --bg2: #161616; --bg3: #1e1e1e; --bg4: #252525;
  --border: #2a2a2a; --border2: #383838;
  --text: #e4e4e7; --text2: #a1a1aa; --text3: #71717a;
  --primary: #0ea5e9; --primary-bg: rgba(14,165,233,0.08);
  --ok: #22c55e; --ok-bg: rgba(34,197,94,0.08);
  --fail: #ef4444; --fail-bg: rgba(239,68,68,0.08);
  --warn: #f59e0b; --warn-bg: rgba(245,158,11,0.08);
}
body { font-family: -apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:13px; }

.header { background:var(--bg2); border-bottom:1px solid var(--border); padding:12px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10; gap:12px; flex-wrap:wrap; }
.header h1 { font-size:14px; font-weight:600; }
.header p { font-size:11px; color:var(--text3); }
.header-right { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.stats { display:flex; gap:6px; }
.stat { background:var(--bg3); border:1px solid var(--border); border-radius:5px; padding:3px 9px; font-size:11px; display:flex; align-items:center; gap:4px; }
.sd { width:6px; height:6px; border-radius:50%; }
.sd-ok{background:var(--ok);} .sd-fail{background:var(--fail);} .sd-dunno{background:var(--warn);} .sd-tested{background:var(--primary);}
.progress-wrap { display:flex; align-items:center; gap:8px; }
.progress-track { width:160px; height:5px; background:var(--bg4); border-radius:99px; overflow:hidden; }
.progress-fill { height:100%; background:var(--primary); border-radius:99px; transition:width 0.3s; }
.progress-text { font-size:11px; color:var(--text2); white-space:nowrap; }
.reset-btn { background:var(--bg3); border:1px solid var(--border); color:var(--text2); padding:4px 10px; border-radius:5px; cursor:pointer; font-size:11px; }
.reset-btn:hover { border-color:var(--fail); color:var(--fail); }

.toolbar { padding:8px 20px; border-bottom:1px solid var(--border); display:flex; gap:6px; align-items:center; background:var(--bg2); flex-wrap:wrap; }
.filter-label { font-size:11px; color:var(--text3); }
.filter-btn { background:var(--bg3); border:1px solid var(--border); color:var(--text2); padding:3px 10px; border-radius:99px; cursor:pointer; font-size:11px; }
.filter-btn:hover { border-color:var(--text2); }
.filter-btn.active { background:var(--primary-bg); border-color:var(--primary); color:var(--primary); }

.main { padding:16px 20px; max-width:1100px; margin:0 auto; }

.cat-header { display:flex; align-items:center; gap:8px; margin:24px 0 10px; }
.cat-header:first-child { margin-top:0; }
.cat-title { font-size:11px; font-weight:600; color:var(--text2); letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
.cat-line { flex:1; height:1px; background:var(--border); }
.cat-count { font-size:10px; color:var(--text3); }

.test-card { background:var(--bg2); border:1px solid var(--border); border-radius:7px; margin-bottom:6px; overflow:hidden; }
.test-card:hover { border-color:var(--border2); }
.test-card.status-ok { border-left:3px solid var(--ok); }
.test-card.status-fail { border-left:3px solid var(--fail); }
.test-card.status-dunno { border-left:3px solid var(--warn); }
.test-card.status-tested { border-left:3px solid var(--primary); }
.test-card.hidden { display:none; }

.test-top { padding:10px 12px; display:flex; align-items:flex-start; gap:10px; cursor:pointer; user-select:none; }
.test-top:hover { background:var(--bg3); }
.test-badge { background:var(--bg4); border:1px solid var(--border2); border-radius:3px; padding:2px 6px; font-size:10px; font-weight:600; color:var(--text3); white-space:nowrap; font-family:monospace; }
.test-main { flex:1; min-width:0; }
.test-title-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.test-name { font-size:12px; font-weight:500; }
.tag { font-size:9px; padding:1px 5px; border-radius:2px; font-weight:600; }
.tag-gap { background:rgba(239,68,68,.12); color:#fca5a5; border:1px solid rgba(239,68,68,.25); }
.tag-fixed { background:rgba(34,197,94,.12); color:#86efac; border:1px solid rgba(34,197,94,.25); }
.tag-regr { background:rgba(245,158,11,.12); color:#fcd34d; border:1px solid rgba(245,158,11,.25); }
.tag-edge { background:rgba(129,140,248,.12); color:#a5b4fc; border:1px solid rgba(129,140,248,.25); }
.test-summary { font-size:11px; color:var(--text3); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.test-right { display:flex; align-items:center; gap:6px; }
.si-dot { width:6px; height:6px; border-radius:50%; background:var(--border2); flex-shrink:0; }
.si-dot.ok{background:var(--ok);} .si-dot.fail{background:var(--fail);} .si-dot.tested{background:var(--primary);} .si-dot.dunno{background:var(--warn);}
.si-label { font-size:10px; color:var(--text3); white-space:nowrap; }
.chevron { font-size:9px; color:var(--text3); transition:transform .2s; }
.test-card.expanded .chevron { transform:rotate(90deg); }

.test-body { display:none; padding:0 12px 12px; border-top:1px solid var(--border); }
.test-card.expanded .test-body { display:block; }

.sections { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
@media(max-width:650px){.sections{grid-template-columns:1fr;}}
.section { background:var(--bg3); border:1px solid var(--border); border-radius:5px; padding:8px 10px; }
.section-title { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text3); margin-bottom:6px; }

.steps { list-style:none; counter-reset:step; }
.steps li { counter-increment:step; padding:4px 0 4px 22px; position:relative; font-size:11px; color:var(--text2); border-bottom:1px solid var(--border); line-height:1.5; }
.steps li:last-child { border-bottom:none; padding-bottom:0; }
.steps li::before { content:counter(step); position:absolute; left:0; top:4px; width:15px; height:15px; background:var(--bg4); border:1px solid var(--border2); border-radius:50%; font-size:8px; font-weight:700; color:var(--text3); display:flex; align-items:center; justify-content:center; }

.expected { font-size:11px; color:var(--text2); line-height:1.6; }

.actions-row { margin-top:10px; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.status-btn { padding:4px 10px; border-radius:4px; border:1px solid var(--border2); background:var(--bg3); color:var(--text2); cursor:pointer; font-size:11px; font-weight:500; transition:all .15s; }
.status-btn:hover { border-color:var(--text2); }
.status-btn.active-tested { background:var(--primary-bg); border-color:var(--primary); color:var(--primary); }
.status-btn.active-ok { background:var(--ok-bg); border-color:var(--ok); color:var(--ok); }
.status-btn.active-fail { background:var(--fail-bg); border-color:var(--fail); color:var(--fail); }
.status-btn.active-dunno { background:var(--warn-bg); border-color:var(--warn); color:var(--warn); }
.note-input { flex:1; min-width:180px; background:var(--bg3); border:1px solid var(--border2); border-radius:4px; padding:4px 8px; color:var(--text); font-size:11px; outline:none; }
.note-input:focus { border-color:var(--primary); }
.note-input::placeholder { color:var(--text3); }

.summary { background:var(--bg2); border:1px solid var(--border); border-radius:7px; padding:14px; margin-top:20px; }
.summary-title { font-size:11px; font-weight:600; color:var(--text2); margin-bottom:10px; }
.summary-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; }
.summary-item { background:var(--bg3); border:1px solid var(--border); border-radius:5px; padding:8px 10px; }
.summary-item-title { font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px; }
.id-chip { display:inline-block; border:1px solid var(--border2); border-radius:2px; padding:0 4px; margin:1px; font-size:10px; font-family:monospace; }
.id-chip.ok{border-color:var(--ok);color:var(--ok);} .id-chip.fail{border-color:var(--fail);color:var(--fail);} .id-chip.dunno{border-color:var(--warn);color:var(--warn);}
.fail-notes { margin-top:6px; font-size:10px; color:var(--text3); line-height:1.7; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>eaisyDocs — Manuális Teszt Tracker</h1>
    <p>Kattints a kártyára a részletekért. Eredmények localStorage-ban tárolódnak.</p>
  </div>
  <div class="header-right">
    <div class="stats">
      <div class="stat"><div class="sd sd-ok"></div><span id="cnt-ok">0</span> ok</div>
      <div class="stat"><div class="sd sd-fail"></div><span id="cnt-fail">0</span> fail</div>
      <div class="stat"><div class="sd sd-dunno"></div><span id="cnt-dunno">0</span> ?</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="prog"></div></div>
      <span class="progress-text" id="prog-txt">0/0</span>
    </div>
    <button class="reset-btn" onclick="if(confirm('Biztosan törlöd az összes eredményt?')){localStorage.clear();location.reload()}">🗑 Reset</button>
  </div>
</div>

<div class="toolbar">
  <span class="filter-label">Szűrő:</span>
  <button class="filter-btn active" data-f="all">Összes</button>
  <button class="filter-btn" data-f="fail">❌ Nem működik</button>
  <button class="filter-btn" data-f="dunno">❓ Nem értem</button>
  <button class="filter-btn" data-f="untested">⬜ Teszteletlen</button>
  <button class="filter-btn" data-f="ok">✅ Működik</button>
</div>

<div class="main" id="main"></div>

<script>
const T = [
// ===== A: INBOX / BEÉRKEZTETÉS =====
{ cat:"🟥 A", catTitle:"Inbox — Beérkeztetés & Email", tests:[
  { id:"A1", title:"Email beérkezés — IMAP szinkron", tags:[], summary:"Az IMAP-on beérkező email megjelenik az Inbox-ban",
    steps:["Küldj egy emailt az IMAP-ra beállított postafiókra","Várd meg az IMAP cron futását (vagy triggerd manuálisan: /api/cron/imap)","Navigálj az Inbox oldalra","Ellenőrizd, hogy megjelent-e az email"],
    expected:"✓ Az email megjelenik az Inbox listában, tárggyal, feladóval, dátummal. ✗ Ha nem jelenik meg → IMAP konfig vagy cron hiba." },
  { id:"A2", title:"Melléklet nélküli email megjelenítése", tags:["edge"], summary:"Csak szöveges email, melléklet nélkül",
    steps:["Küldj plain text emailt melléklet nélkül","Fogadd az Inbox-ban és nyisd meg a részletes nézetet","Ellenőrizd: jelenik-e meg fájllista?"],
    expected:"✓ Fájllista/melléklet szekció NEM jelenik meg ha nincs melléklet. A szöveges tartalom olvasható. Nincs üres box." },
  { id:"A3", title:"Nagyon hosszú email tárgy (>200 karakter)", tags:["edge"], summary:"Hosszú tárgy nem töri el a layoutot",
    steps:["Küldj emailt 250+ karakteres tárggyal","Nézd meg a tárgyat az Inbox listában és a részletes nézetben"],
    expected:"✓ A tárgy truncated (rövidített) formában jelenik meg a listában, a részletes nézetben teljes. A layout nem törik." },
  { id:"A4", title:"Speciális karakterek a tárgyban (< > & aposztróf)", tags:["edge"], summary:"XSS-szerű karakterek biztonságosan jelennek meg",
    steps:["Küldj emailt tárggyal ami tartalmaz: kisebb-mint jelet, script tagot, aposztrófot","Fogadd az Inbox-ban és nyisd meg","Ellenőrizd: a tárgy szövegként jelenik meg, nem kódként fut le"],
    expected:"A speciális karakterek escaped formában jelennek meg (pl. &lt; &gt; &amp;). NEM futnak le script tagok, NEM törik el a layoutot." },
  { id:"A5", title:"Dupla kézbesítés — ugyanaz az email kétszer", tags:["edge"], summary:"Azonos Message-ID nem kerülhet kétszer az adatbázisba",
    steps:["Ellenőrizd Supabase Studióban: van-e unique constraint a kulso_forras / message_id mezőn az irat táblában","Küldj ugyanolyan email-t kétszer (vagy manuálisan duplikáld az adatbázisban)"],
    expected:"✓ A második kézbesítési kísérlet nem hoz létre duplikált irat rekordot. Unique constraint megakadályozza." }
]},

// ===== B: IKTATÁS =====
{ cat:"🟥 B", catTitle:"Iktatás — Alapfolyamat", tests:[
  { id:"B1", title:"Dupla iktatás (race condition)", tags:["regr"], summary:"Két tab egyszerre próbál iktatni ugyanazt az iratot",
    steps:["Nyisd meg ugyanazt az érkeztetett iratot két különböző böngésző tabban","Mindkét tabban töltsd ki az iktatási panelt","Kattints mindkét tabban egyszerre az 'Iktat' gombra","Ellenőrizd az eredményt"],
    expected:"✓ Az egyik iktatás sikeres. ✗ A másik: 'Ezt az iratot már egy másik felhasználó iktatta!' Pontosan 1 ugyirat_id kapcsolódik az irathoz." },
  { id:"B2", title:"Iktatás üres tárggyal (new mode)", tags:[], summary:"Validáció megakadályozza az üres tárgyú iktatást",
    steps:["Nyiss meg egy érkeztetett iratot","Válaszd az 'Új ügyiratba' opciót","Hagyd üresen a Tárgy mezőt, töltsd ki a többit","Kattints az 'Iktat' gombra"],
    expected:"✓ Hibaüzenet: 'Minden mező kitöltése kötelező'. Az iktatás NEM megy végbe." },
  { id:"B3", title:"Alszám számítás meglévő ügyiratnál", tags:[], summary:"Az alszám mindig max+1, nem újrahasznosít",
    steps:["Keress egy ügyiratot amelyhez már 3+ irat van iktatva","Iktass be egy új iratot ebbe az ügyiratba","Ellenőrizd az alszámot Supabase Studióban (irat tábla, alszam mező)"],
    expected:"✓ Az alszám = (eddigi maximum) + 1. Törölt iratok alszámai NEM kerülnek újra kiosztásra." },
  { id:"B4", title:"Partner duplikátum megelőzés iktatáskor", tags:["regr"], summary:"Meglévő partner neve nem hoz létre duplikált rekordot",
    steps:["Ellenőrizd a partner tábla egy névét Supabase Studióban (pl. 'Kovács Kft.')","Iktass be iratot, kézzel add meg ezt a partner nevet az iktatási panelen","Ellenőrizd az iktatás után a partner táblát: csak 1 sor van-e ezzel a névvel?"],
    expected:"✓ Partner táblában pontosan 1 'Kovács Kft.' rekord. NEM jön létre duplikált." },
  { id:"B5", title:"Iktatószám gap-mentesség", tags:[], summary:"Megszakított folyamat esetén a lyuk nem újrahasznosítható",
    steps:["A következő iktatásnál figyeld meg a generált iktatószámot","Ha van hozzáférésed: Supabase Studióban nézd az iktatoszam_seq táblát","Iktass be két iratot egymás után — a második szám pontosan eggyel több kell legyen"],
    expected:"✓ Az iktatószámok folyamatosan nőnek, nem ismétlődnek, lyukak nem kerülnek újrahasznosításra." },
  { id:"B6", title:"Iktatás — meglévő lezárt ügyiratba", tags:["gap"], summary:"Irattárban státuszú ügyiratba ne lehessen iktatni",
    steps:["Keress egy 'irattarban' státuszú ügyiratot","Az Inbox-ból próbálj iktatni ebbe a meglévő ügyiratba","Ellenőrizd: engedte-e?"],
    expected:"✗ ISMERT GAP: valószínűleg engedi. Ez bug. Dokumentáld az eredményt!" }
]},

// ===== C: AI METAADAT =====
{ cat:"🟥 C", catTitle:"AI Metaadat Kinyerés", tests:[
  { id:"C1", title:"Feladó ≠ Küldő szervezet", tags:["regr"], summary:"AI a dokumentum tartalmából azonosítja a küldőt, nem az email feladójából",
    steps:["Küldj emailt saját neveddel amelynek melléklete egy Infopark Kft. fejléces levél","Fogadd az Inbox-ban, kattints 'AI Kitöltés'","Ellenőrizd a 'Küldő partner' mezőt"],
    expected:"✓ Küldő partner: 'Infopark Kft.' (vagy hasonló), NEM a te neved. Ha a te nevedet írja → ✗ BUG (ismert regresszió)." },
  { id:"C2", title:"Hivatkozott szám az utolsó oldalon", tags:["edge"], summary:"Többoldalas PDF — AI az egész dokumentumot feldolgozza",
    steps:["Készíts 4-5 oldalas PDF-et ahol a hivatkozott szerződésszám csak az UTOLSÓ oldalon van","Küldj be emailben, nyisd meg az Inbox-ban","Futtasd az AI Kitöltést, ellenőrizd a Hivatkozott szám mezőt"],
    expected:"✓ Az AI megtalálja a hivatkozott számot az utolsó oldalról. Ha csak az első oldalt olvassa → ✗ BUG." },
  { id:"C3", title:"Több melléklet — PDF preferencia", tags:[], summary:"PDF preferált képekkel szemben AI feldolgozáshoz",
    steps:["Küldj emailt 3 melléklettel: kép, PDF, kép sorrendben","Futtasd az AI Kitöltést","Ellenőrizd az indoklás mezőből melyik fájlból dolgozott"],
    expected:"✓ Az AI a PDF-et dolgozza fel, NEM a képeket." },
  { id:"C4", title:"AI cache — újrafuttatás friss eredményt ad", tags:["regr"], summary:"🔄 gomb valóban friss kinyerést indít",
    steps:["Futtasd az AI Kitöltést (rossz eredménnyel)","Kattints a 🔄 (újraértelmezés) gombra","Megváltozott-e az eredmény? Nem cache-ből jön?"],
    expected:"✓ Friss AI hívás indul. Az eredmény eltérhet az elsőtől. Cache-elt adat NEM kerülhet visszaadásra." },
  { id:"C5", title:"AI újraértelmezés gomb láthatósága", tags:["fixed"], summary:"🔄 gomb csak első futtatás után jelenik meg",
    steps:["Nyiss meg egy FRISS, még soha nem AI-kitöltött iratot","Ellenőrizd: látható-e a 🔄 gomb?","Kattints az 'AI Kitöltés'-re és várd meg","Most ellenőrizd újra: megjelent-e a 🔄 gomb?"],
    expected:"✓ Friss iratnál a 🔄 NEM látható. Az első futtatás UTÁN megjelenik. Ha mindig látható → regresszió." },
  { id:"C6", title:"Nagyon rövid / üres dokumentum", tags:["edge"], summary:"AI-nak kezelnie kell a 0-5 szavas dokumentumot",
    steps:["Küldj be egy PDF-et ami csak 1 sort tartalmaz (pl. csak egy fejléc)","Futtasd az AI Kitöltést"],
    expected:"✓ Az AI nem crashel. A mezők üresen maradnak vagy minimális adattal töltődnek. Nincs 500-as szerver hiba." },
  { id:"C7", title:"Előzmény javaslat relevancia", tags:["regr"], summary:"Pusztán feladó egyezés nem indokol >50% javaslatot",
    steps:["Keress egy feladót akitől korábban más témájú irat érkezett","Küldj teljesen más témájú emailt ugyanattól","Futtasd az AI Kitöltést — nézd az előzmény javaslatot"],
    expected:"✓ Előzmény javaslat üres, vagy <30% egyezéssel. NEM kap 50%+ javaslatot csak feladó egyezés alapján." },
  { id:"C8", title:"Rosszul olvasható scan — AI nem találgat", tags:[], summary:"Alacsony confidence esetén mezők üresen maradnak",
    steps:["Küldj gyenge minőségű, beolvasott PDF-et","Futtasd az AI Kitöltést","Ellenőrizd a hivatkozott_szam és típus mezőket"],
    expected:"✓ Mezők üresen maradnak (nem találgat). Confidence alacsony. Nincs hibás adat a formban." }
]},

// ===== D: HOZZÁFÉRÉS-VEZÉRLÉS =====
{ cat:"🟨 D", catTitle:"Hozzáférés-vezérlés (ABAC/RLS)", tests:[
  { id:"D1", title:"Szervezeti egységen kívüli ügyirat — ügyintéző", tags:[], summary:"Ügyintéző nem láthat más osztály ügyiratát",
    steps:["Jelentkezz be Teszt Elek (ügyintéző) fiókkal","Keresd egy másik szervezeti egység ügyiratának URL-jét","Nyisd meg közvetlenül a böngészőben"],
    expected:"✓ 'Hozzáférés Megtagadva' oldal jelenik meg, NEM az ügyirat tartalma. Esemény naplózódik." },
  { id:"D2", title:"Ügyintéző nem zárhat le ügyiratot", tags:[], summary:"Lezárás jog: vezető/admin/iktató",
    steps:["Teszt Elek fiókkal keress egy ügyiratot amelynek ő a felelőse","Kattints a 'Lezárás' gombra"],
    expected:"✓ Hibaüzenet: 'Ügyintéző nem zárhat le ügyiratot.' Státusz változatlan." },
  { id:"D3", title:"Bizalmas ügyirat + nem megfelelő jogosultsági szint", tags:[], summary:"Nyilt szintű felhasználó nem láthat bizalmas ügyiratot",
    steps:["Keress egy 'bizalmas' minősítésű ügyiratot admin fiókkal, másold az URL-t","Teszt Elek (nyilt szint) fiókkal nyisd meg az URL-t","Ellenőrizd az esemény_naplo-t: naplózódott-e a kísérlet?"],

    expected:"✓ A másik böngészőben 401/session expired hiba keletkezik. A régi session érvénytelen." }
]},

// ===== M: REGRESSZIÓ & ISMERT FIXEK =====
{ cat:"✅ M", catTitle:"Regresszió — Korábban Javított Bugok", tests:[
  { id:"M1", title:"Üres email box nem jelenik meg", tags:["fixed"], summary:"Ha email szöveges törzse nincs, üres box NEM látható",
    steps:["Küldj emailt csatolmánnyal, szöveges törzs nélkül","Fogadd az Inbox-ban, nyisd meg a részletes nézetet"],
    expected:"✓ Üres szöveg doboz NEM látható. Csak a melléklet. Ha üres box látszik → regresszió." },
  { id:"M2", title:"Warning banner — piros szín (nem sárga)", tags:["fixed"], summary:"Bizalmas ügyirat figyelmeztetés piros (destructive)",
    steps:["Nyiss meg egy 'bizalmas' minősítésű ügyiratot","Ellenőrizd a figyelmeztetési sáv színét az oldal tetején"],
    expected:"✓ Sáv piros / destructive colored. NEM sárga/amber. Ha sárga → regresszió." },
  { id:"M3", title:"Teszt Elek — Hozzáférés Megtagadva oldal olvasható", tags:["fixed"], summary:"Hozzáférés megtagadva oldal piros ikonnal, olvasható",
    steps:["Teszt Elek fiókkal nyisd meg egy bizalmas ügyirat URL-jét","Ellenőrizd: szín, olvashatóság, jogosultsági szint kijelzése"],
    expected:"✓ Piros ikon, olvasható szöveg, Teszt Elek jogosultsági szintje megjelenik. Ha sárga → regresszió." },
  { id:"M4", title:"AI kitöltés — hivatkozott szám első futtatásra", tags:["regr"], summary:"Első futtatásra is beírja a hivatkozott számot (ne kelljen kétszer futtatni)",
    steps:["Küldj egy dokumentumot ahol jól látható hivatkozott szám/szerződésszám van","Futtasd az AI Kitöltést ELŐSZÖR","Ellenőrizd: beírta-e első alkalommal a hivatkozott számot?"],
    expected:"✓ Az első futtatásra beírja. Ha csak második futtatásra töltődik ki → ismert, de még javítandó bug." },
  { id:"M5", title:"AI kitöltés — küldő partner helyes (ne a feladó nevét írja)", tags:["regr"], summary:"Az AI a Kft. nevét írja, nem az email feladó személyét",
    steps:["Küldj emailt saját neveddel amelynek melléklete egy Infopark Kft. levél","Futtasd az AI Kitöltést","Ellenőrizd a Küldő partner mezőt"],
    expected:"✓ Küldő partner: 'Infopark Kft.' NEM a te személyes neved. Ha a személyes neved → regresszió." }
]}
];

// ===== RENDER ENGINE =====
function ld(id){try{return JSON.parse(localStorage.getItem('et_'+id)||'{}')}catch(e){return{}}}
function sv(id,d){localStorage.setItem('et_'+id,JSON.stringify(d))}
function h(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
let filter='all';

const STATUSES=[
  {key:'tested',label:'Tesztelve',cls:'active-tested'},
  {key:'ok',label:'✓ Működik',cls:'active-ok'},
  {key:'fail',label:'✗ Nem működik',cls:'active-fail'},
  {key:'dunno',label:'? Nem értem',cls:'active-dunno'},
];
const STATUS_LABEL={tested:'Tesztelve',ok:'Működik',fail:'Nem működik',dunno:'Nem értem'};

function render(){
  const main=document.getElementById('main');
  main.innerHTML='';
  let total=0,done=0,okN=0,failN=0,dunnoN=0;

  T.forEach(cat=>{
    const catDiv=document.createElement('div');
    catDiv.innerHTML=`<div class="cat-header"><span class="cat-title">${cat.cat} — ${cat.catTitle}</span><div class="cat-line"></div><span class="cat-count">${cat.tests.length}</span></div>`;
    main.appendChild(catDiv);

    cat.tests.forEach(t=>{
      total++;
      const st=ld(t.id);
      if(st.status)done++;
      if(st.status==='ok')okN++;
      if(st.status==='fail')failN++;
      if(st.status==='dunno')dunnoN++;

      const hidden=(filter!=='all')&&(
        (filter==='fail'&&st.status!=='fail')||
        (filter==='ok'&&st.status!=='ok')||
        (filter==='dunno'&&st.status!=='dunno')||
        (filter==='untested'&&st.status)
      );

      const card=document.createElement('div');
      card.className='test-card'+(st.status?' status-'+st.status:'')+(hidden?' hidden':'');
      card.id='card-'+t.id;

      const tags=(t.tags||[]).map(g=>({
        gap:`<span class="tag tag-gap">⚠ GAP</span>`,
        fixed:`<span class="tag tag-fixed">✓ Fix</span>`,
        regr:`<span class="tag tag-regr">↩ Regr</span>`,
        edge:`<span class="tag tag-edge">◆ Edge</span>`,
      }[g]||'')).join('');

      const si=st.status?`<div class="si-dot ${st.status}"></div><span class="si-label">${STATUS_LABEL[st.status]}</span>`:`<div class="si-dot"></div><span class="si-label">Nem tesztelt</span>`;

      const stepsHtml=t.steps.map(s=>`<li>${h(s)}</li>`).join('');

      card.innerHTML=`
        <div class="test-top" onclick="toggleCard('${t.id}')">
          <span class="test-badge">${h(t.id)}</span>
          <div class="test-main">
            <div class="test-title-row"><span class="test-name">${h(t.title)}</span>${tags}</div>
            <div class="test-summary">${h(t.summary)}</div>
          </div>
          <div class="test-right">${si}<span class="chevron">&#9658;</span></div>
        </div>
        <div class="test-body">
          <div class="sections">
            <div class="section">
              <div class="section-title">Mit kell csinalni</div>
              <ol class="steps">${stepsHtml}</ol>
            </div>
            <div class="section">
              <div class="section-title">Elvart eredmeny</div>
              <div class="expected">${h(t.expected)}</div>
            </div>
          </div>
          <div class="actions-row" id="act-${t.id}"></div>
        </div>`;
      main.appendChild(card);

      const row=card.querySelector('#act-'+t.id);
      STATUSES.forEach(s=>{
        const btn=document.createElement('button');
        btn.className='status-btn'+(st.status===s.key?' '+s.cls:'');
        btn.textContent=s.label;
        btn.onclick=e=>{
          e.stopPropagation();
          const cur=ld(t.id);
          sv(t.id,{...cur,status:cur.status===s.key?null:s.key});
          render();
          const nc=document.getElementById('card-'+t.id);
          if(nc)nc.classList.add('expanded');
        };
        row.appendChild(btn);
      });
      const note=document.createElement('input');
      note.className='note-input';
      note.placeholder='Megjegyzés, észrevétel...';
      note.value=st.note||'';
      note.onclick=e=>e.stopPropagation();
      note.onchange=()=>{const cur=ld(t.id);sv(t.id,{...cur,note:note.value});};
      row.appendChild(note);
    });
  });

  // Stats
  document.getElementById('cnt-ok').textContent=okN;
  document.getElementById('cnt-fail').textContent=failN;
  document.getElementById('cnt-dunno').textContent=dunnoN;
  const pct=total>0?Math.round(done/total*100):0;
  document.getElementById('prog').style.width=pct+'%';
  document.getElementById('prog-txt').textContent=`${done}/${total} (${pct}%)`;

  // Summary
  const existingS=document.getElementById('summary-panel');
  if(existingS)existingS.remove();
  const allTests=T.flatMap(c=>c.tests);
  const okIds=allTests.filter(t=>ld(t.id).status==='ok');
  const failIds=allTests.filter(t=>ld(t.id).status==='fail');
  const dunnoIds=allTests.filter(t=>ld(t.id).status==='dunno');
  if(okN+failN+dunnoN===0)return;
  const panel=document.createElement('div');
  panel.className='summary';panel.id='summary-panel';
  const chip=(t,cls)=>`<span class="id-chip ${cls}">${t.id}</span>`;
  panel.innerHTML=`<div class="summary-title">Összesítő</div><div class="summary-grid">
    ${okN>0?`<div class="summary-item"><div class="summary-item-title" style="color:var(--ok)">✓ Működik (${okN})</div><div>${okIds.map(t=>chip(t,'ok')).join('')}</div></div>`:''}
    ${failN>0?`<div class="summary-item"><div class="summary-item-title" style="color:var(--fail)">✗ Nem működik (${failN})</div><div>${failIds.map(t=>chip(t,'fail')).join('')}</div><div class="fail-notes">${failIds.map(t=>{const s=ld(t.id);return s.note?`${t.id}: ${s.note}<br>`:''}).join('')}</div></div>`:''}
    ${dunnoN>0?`<div class="summary-item"><div class="summary-item-title" style="color:var(--warn)">? Nem értem (${dunnoN})</div><div>${dunnoIds.map(t=>chip(t,'dunno')).join('')}</div></div>`:''}
  </div>`;
  main.appendChild(panel);
}

function toggleCard(id){
  const c=document.getElementById('card-'+id);
  if(c)c.classList.toggle('expanded');
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filter=btn.dataset.f;
    render();
  });
});

render();
</script>
</body>
</html>
