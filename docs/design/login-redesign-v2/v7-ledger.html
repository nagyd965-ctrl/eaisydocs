<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>7. variáns — Iktatókönyv-motívum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #FAFAF9; color: #18181B; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 24px; position: relative; overflow-x: hidden;
  }
  /* Iktatókönyv-sorok */
  body::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px);
    background-size: 100% 38px;
    mask-image: radial-gradient(ellipse 85% 80% at 50% 45%, black 25%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 85% 80% at 50% 45%, black 25%, transparent 78%);
  }
  /* Margóvonal — mint egy notesz/iktatókönyv bal éle */
  .margin-line { position: absolute; top: 0; bottom: 0; left: 16%; width: 1px; background: rgba(13,148,136,.16); }
  .margin-line2 { position: absolute; top: 0; bottom: 0; right: 16%; width: 1px; background: rgba(13,148,136,.10); }
  /* „Bejegyzés-jelölők" — mint iktatási sorszámok egy-egy sor elején */
  .mark { position: absolute; left: calc(16% - 14px); width: 10px; height: 10px; border-radius: 2px; background: rgba(13,148,136,.22); }
  .m1 { top: 22%; } .m2 { top: 47%; background: rgba(13,148,136,.14); } .m3 { top: 74%; background: rgba(13,148,136,.18); }
  /* Finom felső ragyogás, hogy ne legyen lapos */
  body::after {
    content: ""; position: absolute; width: 700px; height: 320px; top: -140px; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(13,148,136,.09), transparent 70%);
    pointer-events: none;
  }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; }
  .logo { text-align: center; font-size: 26px; letter-spacing: -0.5px; margin-bottom: 10px; }
  .logo .a { color: rgba(24,24,27,.72); font-weight: 500; }
  .logo .b { color: #0D9488; font-weight: 800; }
  .tagline { text-align: center; font-size: 13px; color: #71717A; margin-bottom: 36px; }
  .card { background: #fff; border: 1px solid #E7E7E4; border-radius: 14px; padding: 32px 28px 28px; box-shadow: 0 1px 2px rgba(0,0,0,.02); }
  .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .card .hint { font-size: 12px; color: #71717A; margin-bottom: 24px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #3F3F46; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input { width: 100%; height: 42px; border: 1px solid #E4E4E7; border-radius: 8px; padding: 0 14px; font-family: inherit; font-size: 14px; outline: none; background: #fff; }
  input:focus { border-color: #0D9488; box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .row a { font-size: 12px; color: #0D9488; text-decoration: none; font-weight: 500; }
  button { width: 100%; height: 44px; background: #0D9488; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  .footer { margin-top: 26px; text-align: center; font-size: 11px; color: #A1A1AA; line-height: 1.9; }
  @media (max-width: 720px) { .margin-line, .margin-line2, .mark { display: none; } }
</style>
</head>
<body>
  <div class="margin-line"></div>
  <div class="margin-line2"></div>
  <div class="mark m1"></div>
  <div class="mark m2"></div>
  <div class="mark m3"></div>
  <div class="wrap">
    <div class="logo"><span class="a">eai</span><span class="b">sy</span></div>
    <p class="tagline">Iratkezelő és munkaügyi platform</p>
    <div class="card">
      <h2>Bejelentkezés</h2>
      <p class="hint">Add meg az e-mail címedet és jelszavadat.</p>
      <div class="field">
        <label>E-mail cím</label>
        <input type="email" placeholder="te@ceged.hu">
      </div>
      <div class="field">
        <div class="row"><label style="margin:0">Jelszó</label><a href="#">Elfelejtett jelszó?</a></div>
        <input type="password">
      </div>
      <button>Bejelentkezés</button>
    </div>
    <div class="footer">© 2026 eaisy · Adatvédelmi tájékoztató · ÁSZF · Kapcsolat</div>
  </div>
</body>
</html>
