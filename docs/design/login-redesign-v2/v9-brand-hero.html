<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>9. variáns — Hivatalos eaisy márka (hero-bg + logó + szlogen)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: #18181B; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 24px; position: relative; overflow-x: hidden;
  }
  /* Az eaisy.hu hivatalos hero háttere */
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background: url("assets/hero-bg.png") center center / cover no-repeat;
  }
  /* Finom világos fátyol a olvashatóságért */
  .veil {
    position: fixed; inset: 0; z-index: -1;
    background: linear-gradient(180deg, rgba(250,251,252,.62) 0%, rgba(250,251,252,.45) 45%, rgba(250,251,252,.66) 100%);
    backdrop-filter: blur(1.5px);
  }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; }
  /* Hivatalos eaisy logó */
  .logo-img { display: block; margin: 0 auto 14px; height: 44px; width: auto; }
  .tagline { text-align: center; font-size: 13.5px; font-weight: 600; letter-spacing: .2px; color: rgba(24,24,27,.72); margin-bottom: 34px; }
  .card { background: rgba(255,255,255,.9); border: 1px solid rgba(255,255,255,.95); outline: 1px solid #E4E7E8; border-radius: 14px; padding: 32px 28px 28px; backdrop-filter: blur(10px); }
  .card h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .card .hint { font-size: 12px; color: #71717A; margin-bottom: 24px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #3F3F46; margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input { width: 100%; height: 42px; border: 1px solid #E4E4E7; border-radius: 8px; padding: 0 14px; font-family: inherit; font-size: 14px; outline: none; background: #fff; }
  input:focus { border-color: #0D9488; box-shadow: 0 0 0 3px rgba(13,148,136,.12); }
  .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .row a { font-size: 12px; color: #0D9488; text-decoration: none; font-weight: 500; }
  button { width: 100%; height: 44px; background: #0D9488; color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; }
  /* A családi oldal bizalmi sora */
  .trust { display: flex; justify-content: center; gap: 20px; margin-top: 24px; font-size: 11.5px; color: rgba(24,24,27,.55); font-weight: 500; }
  .trust span { display: flex; align-items: center; gap: 7px; }
  .trust i { width: 5px; height: 5px; border-radius: 2px; background: #0D9488; }
  .footer { margin-top: 22px; text-align: center; font-size: 11px; color: rgba(24,24,27,.4); line-height: 1.9; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>
  <div class="wrap">
    <img class="logo-img" src="assets/eaisy-logo.png" alt="eaisy">
    <p class="tagline">Könnyebb működés. Nagyobb szabadság.</p>
    <div class="card">
      <h2>Bejelentkezés</h2>
      <p class="hint">Add meg az e-mail címedet és jelszavadat.</p>
      <div class="field">
        <label>E-mail cím</label>
        <input type="email" placeholder="te@ceged.hu">
      </div>
      <div class="field">
        <div class="row"><label style="margin:0">Jelszó</label><a href="#">Elfelejtett jelszó?</a></div>
        <input type="password">
      </div>
      <button>Bejelentkezés</button>
    </div>
    <div class="trust">
      <span><i></i>100% GDPR kompatibilis</span>
      <span><i></i>AI-támogatott</span>
    </div>
    <div class="footer">© 2026 THINK AI Kft. · Adatvédelmi tájékoztató · Kapcsolat</div>
  </div>
</body>
</html>
