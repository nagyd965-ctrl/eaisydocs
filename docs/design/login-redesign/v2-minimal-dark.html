<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Variáns 2 — Minimal sötét · eaisy login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #09090B; color: #E4E4E7; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 48px 24px; position: relative; overflow: hidden;
  }
  body::before {
    content: ""; position: absolute; width: 900px; height: 480px; top: -220px; left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(13,148,136,.22) 0%, rgba(13,148,136,.07) 45%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 100% 56px; pointer-events: none;
  }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; }

  .logo { text-align: center; font-size: 26px; letter-spacing: -0.5px; margin-bottom: 10px; }
  .logo .a { color: rgba(228,228,231,.7); font-weight: 500; }
  .logo .b { color: #14D4B8; font-weight: 800; }
  .tagline { text-align: center; font-size: 13px; color: #71717A; margin-bottom: 36px; }

  .card {
    background: #101013; border: 1px solid #232327; border-radius: 14px;
    padding: 32px 28px 28px;
  }
  .card h2 { font-size: 17px; font-weight: 600; color: #FAFAFA; margin-bottom: 4px; }
  .card .hint { font-size: 12px; color: #71717A; margin-bottom: 24px; }

  label { display: block; font-size: 12px; font-weight: 600; color: #A1A1AA; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input {
    width: 100%; height: 42px; border: 1px solid #2A2A2F; border-radius: 8px;
    padding: 0 14px; font-family: inherit; font-size: 14px; color: #FAFAFA;
    background: #0B0B0D; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #52525B; }
  input:focus { border-color: #14D4B8; box-shadow: 0 0 0 3px rgba(20,212,184,.1); }
  .pw-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .pw-row a { font-size: 12px; color: #14D4B8; text-decoration: none; font-weight: 500; }
  .pw-row a:hover { text-decoration: underline; }

  button {
    width: 100%; height: 44px; background: #14D4B8; color: #04211D; border: none; border-radius: 8px;
    font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 6px;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.08); }

  .mfa {
    margin-top: 18px; padding-top: 16px; border-top: 1px solid #1D1D21;
    font-size: 11px; color: #52525B; text-align: center; line-height: 1.7;
  }
  .mfa b { color: #A1A1AA; font-weight: 600; }

  .footer { margin-top: 28px; text-align: center; font-size: 11px; color: #52525B; line-height: 1.9; }
  .footer a { color: #71717A; text-decoration: none; }
  .footer a:hover { color: #14D4B8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span class="a">eai</span><span class="b">sy</span></div>
    <p class="tagline">Iratkezelő és munkaügyi platform</p>

    <div class="card">
      <h2>Bejelentkezés</h2>
      <p class="hint">Add meg az e-mail címedet és jelszavadat.</p>
      <div class="field">
        <label for="email">E-mail cím</label>
        <input id="email" type="email" placeholder="te@ceged.hu" autocomplete="username">
      </div>
      <div class="field">
        <div class="pw-row">
          <label for="password" style="margin-bottom:0">Jelszó</label>
          <a href="#">Elfelejtett jelszó?</a>
        </div>
        <input id="password" type="password" autocomplete="current-password">
      </div>
      <button>Bejelentkezés</button>
      <p class="mfa">A fiókod kétlépcsős azonosítással is védhető — <b>TOTP kód</b> beadása belépés után.</p>
    </div>

    <div class="footer">
      © 2026 eaisy · Magyar fejlesztés<br>
      <a href="#">Adatvédelmi tájékoztató</a> · <a href="#">ÁSZF</a> · <a href="#">Kapcsolat</a>
    </div>
  </div>
</body>
</html>
